version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, backend]
    groups:
      go-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, deploy]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    labels: [dependencies, deploy]
    # A PostgreSQL major version needs a dump/restore (and 18+ moved PGDATA): plan it, don't bump it.
    ignore:
      - dependency-name: postgis/postgis
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /deploy/tiles
    schedule: { interval: monthly }
    labels: [dependencies, deploy]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies, ci]
