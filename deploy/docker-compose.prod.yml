# Production override: HTTPS via Caddy + Let's Encrypt on DOMAIN.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./data/tiles:/srv/tiles:ro
      - ./data/assets:/srv/assets:ro
      - ./data/caddy:/data
  api:
    environment:
      DEV_MODE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PUBLIC_BASE_URL: https://${DOMAIN}
  db:
    ports: []   # never publish PostgreSQL on a public server
