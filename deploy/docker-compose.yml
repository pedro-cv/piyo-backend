# Piyo stack: PostgreSQL/PostGIS + Go API + Martin tile server + Caddy.
# Local simulation: `docker compose up -d` (Caddyfile.local, plain HTTP on :80).
# Production:       `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
# Everything persistent lives under ./data (git-ignored). See docs/implementation/DEPLOY_VPS.md.

name: piyo

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-piyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piyo}
      POSTGRES_DB: ${POSTGRES_DB:-piyo}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"   # localhost only: the importer runs on the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-piyo} -d ${POSTGRES_DB:-piyo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m

  api:
    build: ${API_BUILD_CONTEXT:-..}
    image: piyo/api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DEV_MODE: ${DEV_MODE:-false}
      STORE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-piyo}:${POSTGRES_PASSWORD:-piyo}@db:5432/${POSTGRES_DB:-piyo}?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      HASH_SALT: ${HASH_SALT:-dev-salt}
      RELEASES_DIR: /data/releases
      STYLE_DIR: /data/style
      TILES_DIR: /data/tiles
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      MAX_REPORTS_PER_DAY: ${MAX_REPORTS_PER_DAY:-3}
      MAX_SUGGESTIONS_PER_DAY: ${MAX_SUGGESTIONS_PER_DAY:-5}
      MAX_CONTRIBUTIONS_PER_MONTH: ${MAX_CONTRIBUTIONS_PER_MONTH:-3}
      FARE_BS: ${FARE_BS:-2.50}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-1}
      IP_RATE_PER_MINUTE: ${IP_RATE_PER_MINUTE:-60}
    volumes:
      - ./data/releases:/data/releases
      - ./data/style:/data/style:ro
      - ./data/tiles:/data/tiles:ro
    expose:
      - "8080"

  martin:
    image: ghcr.io/maplibre/martin:v0.15.0
    restart: unless-stopped
    command: ["--config", "/config/martin.yaml"]
    volumes:
      - ./martin/martin.yaml:/config/martin.yaml:ro
      - ./data/tiles:/tiles:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - api
      - martin
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./${CADDYFILE:-Caddyfile.local}:/etc/caddy/Caddyfile:ro
      - ./data/tiles:/srv/tiles:ro
      - ./data/assets:/srv/assets:ro
      - ./data/caddy:/data
